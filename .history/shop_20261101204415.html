<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--=============== FLATICON ===============-->
     <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>

    <!--=============== SWIPER CSS ===============-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />

    <!--=============== CSS ===============-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="icon" href="assets/img/tab-img.png" type="image/png">
    <title>Shop</title>
  </head>
  <body>
    <!--=============== HEADER ===============-->
    <div id="header-placeholder"></div>

    <!--=============== MAIN ===============-->
    <main class="main">
      <!--=============== BREADCRUMB ===============-->
      <div id="breadcrumb-placeholder"></div>
      <!--=============== CATEGORIES DROPDOWN ===============-->
      <div id="categories-placeholder"></div>
      <!--=============== PRODUCTS ===============-->
      <section class="products section--lg container">
        <p class="total__products" style="display: none;">We found <span>0</span> items for you!</p>
        <div class="products__container grid">
          <!-- Products will be dynamically injected here by JavaScript -->
        </div>

        <ul class="pagination"></ul>
      </section>

      <!--=============== NEWSLETTER ===============-->
      <div id="newsletter-placeholder"></div>
    </main>

    <!--=============== FOOTER ===============-->
    <div id="footer-placeholder"></div>

    <!--=============== SWIPER JS ===============-->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!--=============== MAIN JS ===============-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/cart-manager.js"></script>
    <script src="assets/js/products-render.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/pagination.js"></script>
    <!-- component-loader script -->
    <script src="components/component-loader.js"></script> 

    <!--=============== ADD TO CART POPUP ===============-->
    <div id="popup-placeholder"></div>
    <div id="quick-view-placeholder"></div>
  </body>
</html>
