<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

     <!--=============== FLATICON ===============-->
     <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>

    <!--=============== SWIPER CSS ===============-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="assets/css/styles.css" />

    <link rel="icon" href="assets/img/tab-img.png" type="image/png">
    <title>Check Out</title>
  </head>
  <body>
    <!--=============== HEADER ===============-->
    <div id="header-placeholder"></div>

    <!--=============== MAIN ===============-->
    <main class="main">
      <!--=============== BREADCRUMB ===============-->
      <section class="breadcrumb">
        <ul class="breadcrumb__list flex container">
         <li><a href="index.html" class="breadcrumb__link">Home</a></li>
         <li><span class="breadcrumb__link">></span></li>
         <li><a href="shop.html" class="breadcrumb__link">Shop</a></li>
         <li><span class="breadcrumb__link">></span></li>
         <li><span class="breadcrumb__link">Checkout</span></li>
        </ul>
      </section>

      <!--=============== CHECKOUT ===============-->
      <section class="checkout  section--lg">
        <div class="checkout__container container grid">
          <div class="checkout__group">
            <h3 class="section__title">Billing Details</h3>

            <form action="" class="form grid">
              <input type="text" placeholder="Name" class="form__input">
              <input type="text" placeholder="Address" class="form__input">
              <input type="text" placeholder="City/District" class="form__input">
              <input type="text" placeholder="Postcode" pattern="[A-Za-z0-9\s]{5,10}" class="form__input">
              <input type="tel" placeholder="Phone" pattern="[0-9]{10}" class="form__input">
              <input type="email" placeholder="Email" class="form__input">

              <h3 class="checkout__title">Additional Information</h3>
              <textarea name="" placeholder="Order note" id="" cols="30" rows="10" class="form__input textarea"></textarea>
            </form>
          </div>

          <div class="checkout__group">
            <h3 class="section__title">Cart Total</h3>

            <table class="order__table">
              <thead>
                <tr>
                  <th colspan="2">Products</th>
                  <th>Total</th>
                </tr>
              </thead>
              <tbody id="checkout-items">
                <!-- JavaScript will inject cart items here -->
              </tbody>

              <!-- You can keep these rows for subtotal, shipping, total, but give them IDs -->
              <tfoot>
                <tr>
                  <td><span class="order__subtitle">Subtotal</span></td>
                  <td colspan="2"><span class="table__price" id="checkout-subtotal">$0.00</span></td>
                </tr>
                <tr>
                  <td><span class="order__subtitle">Shipping</span></td>
                  <td colspan="2"><span class="table__price" id="checkout-shipping"></span></td>
                </tr>
                <tr>
                  <td><span class="order__subtitle">Total</span></td>
                  <td colspan="2"><span class="order__grand-total" id="checkout-total">$0.00</span></td>
                </tr>
              </tfoot>
            </table>


            <!-- payment-method -->
             <div class="payment__methods">
              <h3 class="checkout__title payment__title">Payment</h3>

              <div class="payment__option flex">
                <input type="radio" name="radio" checked class="payment__input">
                <label for="" class="payment__label">Bank Transfer</label>
              </div>

              <div class="payment__option flex">
                <input type="radio" name="radio" class="payment__input">
                <label for="" class="payment__label">GooglePay</label>
              </div>

              <div class="payment__option flex">
                <input type="radio" name="radio"  class="payment__input">
                <label for="" class="payment__label">bKash</label>
              </div>

              <div class="payment__option flex">
                <input type="radio" name="radio" class="payment__input">
                <label for="" class="payment__label">Nagad</label>
              </div>

              <div class="payment__option flex">
                <input type="radio" name="radio" class="payment__input">
                <label for="" class="payment__label">Rocket</label>
              </div>

              <div class="payment__option flex">
                <input type="radio" name="radio" class="payment__input">
                <label for="" class="payment__label">upay</label>
              </div>
             </div>
             <button class="btn btn--md">
                <i class="fi fi-br-box-alt"></i> Place Order
            </button>
          </div>
        </div>
      </section>

       <!--=============== NEWSLETTER ===============-->
       <div id="newsletter-placeholder"></div>
    </main>

    <!--=============== FOOTER ===============-->
    <div id="footer-placeholder"></div>

     <!--=============== SWIPER JS ===============-->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!--=============== MAIN JS ===============-->
    <script src="assets/js/cart-manager.js"></script>
    <script src="assets/js/wishlist-manager.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
