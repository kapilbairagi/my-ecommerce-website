    <!--=============== LOGIN-REGISTER ===============-->
      <section class="login-register section--lg">
        <div class="login-register__container container">
          <a href="index.html"><img src="assets/img/logo.svg" alt="Logo" /></a>
          <div class="login">
            <h3 class="section__title">Login</h3>
            
            <!-- UPDATED FORM STARTS HERE -->
            <form id="loginForm" action="" class="form grid">
              <div class="input-box">
                <!-- Changed to type="email" and added id="login-email" -->
                <input type="email" id="login-email" placeholder="Email" class="form__input" required>
                <i class="fi fi-br-envelope"></i>
              </div>

              <div class="input-box">
                <input type="password" id="login-password" placeholder="Password" class="form__input" required>
                <i class="fi fi-br-lock"></i>
                <i class="fi fi-br-eye toggle-password" data-target="login-password"></i>
              </div>
              
              <div class="form__options">
                <label class="form__remember">
                  <input type="checkbox" checked> Remember Me
                </label>
                <a href="forget-password.html" class="form__forgot">Forget Password</a>
              </div>
              
              <div class="form__btn">
                <button type="submit" class="btn btn--full">Login</button>
              </div>
              
              <div class="register__bottom">
                <p>Don't have an account? <a href="register.html">Create Account</a></p>
              </div>
            </form>
            <!-- UPDATED FORM ENDS HERE -->

          </div>
        </div>
      </section>

   <!--=============== SWIPER JS ===============-->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <!--=============== MAIN JS ===============-->
    <script src="assets/js/main.js"></script>

    <!--=============== AUTHENTICATION SCRIPT ===============-->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');

        // --- FORM SUBMISSION ---
        form.addEventListener('submit', async function(e) {
            e.preventDefault(); // Stops the page from refreshing
            
            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('loggedInUser', JSON.stringify(data.user));
                    alert(`Welcome back, ${data.user.username}!`);
                    window.location.href = 'index.html'; 
                } else {
                    alert(data.message);
                }
            } catch (error) {
                console.error("Fetch error:", error); 
                alert("Error: Make sure your backend server is running.");
            }
        });
      });
    </script>

    <!--=============== MAIN JS (LOAD ONCE ONLY) ===============-->
    <script src="assets/js/main.js"></script>
  </body>
