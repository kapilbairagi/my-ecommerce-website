    <!--=============== LOGIN-REGISTER ===============-->
      <section class="login-register section--lg">
        <div class="login-register__container container">
          <a href="index.html"><img src="assets/img/logo.svg" alt="Logo" /></a>
          <div class="login">
            <h3 class="section__title">Create Account</h3>
            <form action="" class="form grid">
              <div class="input-box">
                <input type="text" placeholder="UserName" class="form__input">
                <i class="fi fi-br-user"></i>
              </div>

              <div class="input-box">
                <input type="email" placeholder="Email" class="form__input">
                <i class="fi fi-br-envelope"></i>
              </div>

              <!-- Updated Password Input -->
              <div class="input-box">
                <input type="password" id="reg-password" placeholder="Password" class="form__input">
                <i class="fi fi-br-lock"></i>
              </div>
              <!-- Indicator for Password -->
              <div id="password-indicator" class="password-indicator"></div>

              <!-- Updated Confirm Password Input -->
              <div class="input-box">
                <input type="password" id="reg-confirm-password" placeholder="Confirm Password" class="form__input">
                <i class="fi fi-br-lock"></i>
              </div>
              <!-- Indicator for Confirm Password -->
              <div id="confirm-indicator" class="password-indicator"></div>

              
              
              <div class="form__btn">
                <button type="submit" class="btn btn--full">Create Account</button>
              </div>
              
              <div class="register__bottom">
                <p>Already have an account? <a href="login.html">Login</a></p>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!--=============== SWIPER JS ===============-->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!--=============== AUTHENTICATION SCRIPT ===============-->
    <script>
    document.querySelector('.login-register form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.querySelector('input[placeholder="UserName"]').value;
        const email = document.querySelector('input[placeholder="Email"]').value;
        const password = document.querySelector('input[placeholder="Password"]').value;
        const confirmPassword = document.querySelector('input[placeholder="Confirm Password"]').value;

        // 1. Check if passwords match
        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        // 2. Check Password Strength
        // Regex explanation:
        // (?=.*[a-z]) -> at least one lowercase letter
        // (?=.*[A-Z]) -> at least one uppercase letter
        // (?=.*\d) -> at least one number
        // (?=.*[@$!%*?&]) -> at least one special character
        // [A-Za-z\d@$!%*?&]{8,} -> minimum 8 characters long
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

        if (!passwordRegex.test(password)) {
            alert("Password must be at least 8 characters long and include:\n- Uppercase letter\n- Lowercase letter\n- Number\n- Special character (@$!%*?&)");
            return;
        }

        // 3. Send to Backend
        try {
            const response = await fetch('http://localhost:3000/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                alert("Account created! Please login.");
                window.location.href = 'login.html'; 
            } else {
                alert(data.message);
            }
        } catch (error) {
            alert("Error: Make sure your backend server is running.");
        }
    });
    </script>

    <!--=============== MAIN JS ===============-->
    <script src="assets/js/main.js"></script>
  </body>
